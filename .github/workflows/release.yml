name: Build & Release Desktop App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Windows Binary
        run: |
          go build -tags desktop,production -ldflags "-H windowsgui -s -w" -o NKUST_Suggest_Desktop.exe .
          Compress-Archive -Path "NKUST_Suggest_Desktop.exe", "README.md" -DestinationPath "NKUST_Suggest_Desktop_Windows_x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NKUST_Suggest_Desktop_Windows_x64
          path: NKUST_Suggest_Desktop_Windows_x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS Application
        run: |
          wails build -platform darwin/universal
          cd build/bin
          zip -r ../../NKUST_Suggest_Desktop_macOS_Universal.zip NKUST_Suggest_Desktop.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NKUST_Suggest_Desktop_macOS_Universal
          path: NKUST_Suggest_Desktop_macOS_Universal.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: NKUST_Suggest_Desktop_Windows_x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: NKUST_Suggest_Desktop_macOS_Universal

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NKUST_Suggest_Desktop_Windows_x64.zip
            NKUST_Suggest_Desktop_macOS_Universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
