<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主背景高質感深藍到科技海軍藍漸層 (NKUST Premium Blue Gradient) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 頂部高光與柔和浮雕感 -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <!-- 能量琥珀橘 (行動引導與建言火花) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- 智慧綠 (自動郵件驗證成功印章) -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- 柔和陰影 -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 應用程式圓角基座 (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadowFilter)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#shieldBorderGrad)" stroke-width="4" />

  <!-- 象徵高科大穩健架構的發散微光環 -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- 主體徽章：對話氣泡與校園建言結合 (Chat Bubble + Quill / Paper Plane) -->
  <g transform="translate(106, 100)">
    <!-- 對話氣泡本體 -->
    <path d="M 40 40 
             C 40 18, 58 0, 80 0 
             L 220 0 
             C 242 0, 260 18, 260 40 
             L 260 160 
             C 260 182, 242 200, 220 200 
             L 100 200 
             L 40 250 
             L 40 200 
             C 18 200, 0 182, 0 160 
             L 0 80 
             C 0 58, 18 40, 40 40 Z" 
          fill="rgba(255, 255, 255, 0.12)" 
          stroke="rgba(255, 255, 255, 0.35)" 
          stroke-width="4" />

    <!-- 氣泡內的建言文字條 (象徵精準條理) -->
    <rect x="50" y="55" width="160" height="14" rx="7" fill="rgba(255, 255, 255, 0.75)" />
    <rect x="50" y="85" width="120" height="14" rx="7" fill="rgba(255, 255, 255, 0.55)" />
    <rect x="50" y="115" width="140" height="14" rx="7" fill="rgba(255, 255, 255, 0.35)" />

    <!-- 象徵突破與送出的紙飛機 / 智慧飛梭 (動態揚升) -->
    <g transform="translate(150, 110)">
      <path d="M 0 60 L 130 -30 L 70 120 L 50 75 Z" fill="url(#amberGrad)" filter="url(#glowFilter)" />
      <path d="M 50 75 L 130 -30 L 70 120 Z" fill="rgba(0, 0, 0, 0.18)" />
      <path d="M 50 75 L 80 85 L 70 120 Z" fill="#c2410c" />
    </g>
  </g>

  <!-- 右下方：全自動信件確認完成印章 (Verified Checkmark Seal) -->
  <g transform="translate(325, 325)">
    <circle cx="50" cy="50" r="46" fill="url(#checkGrad)" filter="url(#shadowFilter)" stroke="#ffffff" stroke-width="4" />
    <path d="M 32 50 L 44 63 L 68 37" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
